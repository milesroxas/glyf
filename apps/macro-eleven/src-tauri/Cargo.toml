[package]
name = "macro-eleven"
version = "0.1.0"
description = "Macro Eleven Companion App"
authors = ["Miles Roxas"]
edition = "2021"

[lib]
name = "macro_eleven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
hidapi = "2.6.5"
dirs = "6.0.0"
rusb = { version = "0.9.4", features = ["vendored"] }
sha2 = "0.11.0"
plist = "1.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
    "block2",
    "NSAccessibility",
    "NSAnimation",
    "NSAnimationContext",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSGlassEffectView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSString",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAMediaTimingFunction"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }

[dev-dependencies]
tempfile = "3.27.0"
