[package]
name = "glyf"
version = "0.1.0"
description = "glyf Companion App"
authors = ["Miles Roxas"]
edition = "2021"

[lib]
name = "glyf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
hidapi = "2.6.5"
dirs = "6.0.0"
log = "0.4.29"
env_logger = "0.11.10"
